[package]
name = "chmn"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "RAM-only biometric provider matching with explicit costs and scoped identities"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
repository = "https://git.corbet.ch/corbet-foss/chmn"
readme = "README.md"
publish = false
include = ["Cargo.toml", "src/**", "README.md", "LICENSE", "LICENSE.md", "LICENSES/LGPL-3.0-only.txt", "LICENSES/LGPL-3.0-linking-exception.txt", "LICENSES/GPL-3.0-only.txt"]

[lib]
crate-type = ["rlib"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[dependencies]
cfbk = { git = "https://git.corbet.ch/corbet-foss/cfbk", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }
url = "2"
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
zeroize = "1"
thiserror = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[dev-dependencies]
futures = "0.3"
